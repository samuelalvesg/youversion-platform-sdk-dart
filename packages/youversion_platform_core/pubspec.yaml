name: youversion_platform_core
description: >-
  Unofficial Dart client for the YouVersion Platform APIs: Content (Bibles),
  Sign-In (OAuth PKCE), Data Exchange, Highlights, Languages, Organizations
  and VOTD. Pure Dart, no Flutter dependency.
version: 0.2.0
homepage: https://github.com/samuelalvesg/youversion-platform-sdk-dart
repository: https://github.com/samuelalvesg/youversion-platform-sdk-dart

environment:
  sdk: ^3.4.0

dependencies:
  http: ^1.2.0
  crypto: ^3.0.3

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
