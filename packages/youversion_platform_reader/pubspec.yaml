name: youversion_platform_reader
description: >-
  Unofficial Flutter full Bible-reading screen for the YouVersion Platform:
  passage view, chapter navigation, highlight creation, and font/theme
  settings. Builds on youversion_platform_ui and youversion_platform_core.
version: 0.3.0
homepage: https://github.com/samuelalvesg/youversion-platform-sdk-dart
repository: https://github.com/samuelalvesg/youversion-platform-sdk-dart
topics:
  - youversion
  - bible
  - flutter
  - reader
  - widgets

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  youversion_platform_core:
    path: ../youversion_platform_core
  youversion_platform_ui:
    path: ../youversion_platform_ui
    version: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  http: ^1.2.0

flutter:
  generate: true
