version: 2
updates:
  # One pull request per month per group; majors come separately so a breaking bump is reviewed on its own.
  # The example apps are left out on purpose: they only consume the packages through path dependencies.
  - package-ecosystem: pub
    directories:
      - /packages/youversion_platform_core
      - /packages/youversion_platform_ui
      - /packages/youversion_platform_reader
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      pub-minor-patch:
        update-types: ["minor", "patch"]
      pub-major:
        update-types: ["major"]
