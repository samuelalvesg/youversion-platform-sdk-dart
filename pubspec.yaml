name: youversion_platform
description: >-
  Unofficial Dart client for the YouVersion Platform APIs: Content (Bibles),
  Sign-In (OAuth PKCE) and Data Exchange (highlights sync). Pure Dart, no
  Flutter dependency.
version: 0.1.0
homepage: https://github.com/samuelalvesg/youversion_platform
repository: https://github.com/samuelalvesg/youversion_platform
license: MIT

environment:
  sdk: ^3.4.0

dependencies:
  http: ^1.2.0
  crypto: ^3.0.3

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
